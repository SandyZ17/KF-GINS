version: 1
task: gnss_reliability_estimation
target_platform: ground_vehicle_xy_navigation

inputs:
  gnss:
    - name: gnss_status
      type: int
      desc: NavSat status / receiver fix state (normalized in preprocessing)
    - name: hstd_m
      type: float
      desc: Horizontal std from NavSat covariance
    - name: vstd_m
      type: float
      desc: Vertical std from NavSat covariance
    - name: gnss_dt_sec
      type: float
      desc: Time since previous GNSS sample
    - name: gnss_jump_xy_m
      type: float
      desc: ENU XY distance to previous GNSS sample
    - name: gnss_jump_speed_xy_mps
      type: float
      desc: Jump speed estimated from consecutive GNSS points

  filter:
    - name: nis_last
      type: float
      desc: Last GNSS update NIS
    - name: nis_ema
      type: float
      desc: Exponential moving average of NIS
    - name: innovation_xy_norm
      type: float
      desc: Innovation norm in XY (if available)
    - name: accepted_update_ratio_recent
      type: float
      desc: Acceptance ratio in recent window

  motion:
    - name: odom_speed_xy_mps
      type: float
      desc: Current odom planar speed
    - name: yaw_rate_rps
      type: float
      desc: IMU yaw rate magnitude
    - name: acc_norm_mps2
      type: float
      desc: IMU acceleration norm
    - name: acc_xy_std_recent
      type: float
      desc: Recent XY acceleration std

  optional_vo_lidar:
    - name: vo_valid
      type: bool
      desc: Visual odometry validity flag
    - name: vo_tracking_score
      type: float
      desc: Tracking quality from VO frontend
    - name: lidar_odom_fitness
      type: float
      desc: Registration fitness / score

outputs:
  classification:
    - name: reliability_score
      type: float
      range: [0.0, 1.0]
    - name: hard_reject
      type: bool

  policy:
    - name: r_scale_xy
      type: float
      range: [1.0, 100.0]
    - name: r_scale_z
      type: float
      range: [1.0, 1000.0]
    - name: gnss_update_mode
      type: enum
      values: [xy, xyz]

labeling_recommendation:
  strategy_v1: hybrid_rule_truth
  positive_label:
    - NIS below chi2 threshold
    - XY truth error below threshold (offline only)
  negative_label:
    - GNSS jump outlier
    - high covariance
    - NIS exceedance
    - large XY truth error

