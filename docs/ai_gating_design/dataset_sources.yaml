version: 1
datasets:
  test_demo:
    kind: kf_gins_nav
    description: KF-GINS test demo truth with a generated KF-GINS result bag
    bag: src/KF-GINS/results/kf_gins_demo/kf_gins_ukf_test_bag
    truth: src/KF-GINS/dataset/test_demo/truth.nav
    truth_format: truth_nav
    odom_topic: /kf_gins/odom_pred
    analyze_out_dir: src/KF-GINS/results/ai_gate_dataset/test_demo_analysis
    build_out_dir: src/KF-GINS/results/ai_gate_dataset/test_demo
    notes:
      - Good for stable baseline samples and nominal GNSS behavior

  urbannav_hk_tunnel1:
    kind: urbannav
    description: UrbanNav HK Tunnel-1, urban canyon/tunnel degradation
    bag: src/KF-GINS/results/UrbanNav/UrbanNav-HK-Tunnel-1/urban_nav_hk_tunnel_sr_ukf_nisgate
    truth: src/KF-GINS/dataset/UrbanNav/UrbanNav-HK-Tunnel-1/UrbanNav_tunnel_GT_raw.txt
    truth_format: urbannav_gt_raw
    odom_topic: /kf_gins/odom_pred
    analyze_out_dir: src/KF-GINS/results/ai_gate_dataset/urbannav_hk_tunnel1_analysis
    build_out_dir: src/KF-GINS/results/ai_gate_dataset/urbannav_hk_tunnel1
    segment_start_sec: 100.0
    segment_end_sec: 300.0
    notes:
      - Recommended as degraded-scene samples (canyon / tunnel)
      - 1Hz truth; use XY metrics as primary target for ground vehicle
